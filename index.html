<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cause they're a pain</title>
        <style>
            body {
                font-family: times new roman, serif;
                background-color: #000;
                color: #fff;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            .timezone-entry {
                margin-bottom: 10px;
                justify-content: center;
                align-items: center;
                text-align: center;

                .time {
                    font-size: 2.5em;
                }

                .day {
                    font-size: 0.8em;
                }

             
            }

            hr {
                border: 0;
                border-top: 0.5px solid #ffffff58;
                width: 25%;
            }

            .question {
                margin-top: 0px;
                margin-bottom: 0px;
            }
            .answer {
                font-size: 0.7em;
                margin-top: 5px
            }

            .me {
                color: rgb(231, 129, 124);
            }
        </style>
        <script>
            const urlParams = new URLSearchParams(window.location.search);
            const timezones = urlParams.get('timezones') ? urlParams.get('timezones').split(',') : ['UTC'];
            const labels = urlParams.get('labels') ? urlParams.get('labels').split(',') : ['UTC'];
            const me = urlParams.get('me') ?? 'UTC';
 
            function consoleTimes(time) {
                const timezonesContainer = document.getElementById('timezones');
                const parentDiv = document.createElement('div');
                for (let i = 0; i < timezones.length; i++) {
                    const timezone = timezones[i];
                    const label = labels[i];
                    const div = document.createElement('div');
                    const dateArray = `${new Intl.DateTimeFormat('en-US', {
                        year: "numeric",
                        month: "long",
                        day: "numeric",
                        hour: "numeric",
                        minute: "numeric",
                        second: "numeric",
                        hour12: false,
                        timeZone: timezone,
                    }).format(time)}`.split(' at ');

                    const dayComponent = dateArray[0];
                    const timeComponent = dateArray[1];

                    const template = document.getElementById('timezone-template').content.cloneNode(true);
                    template.querySelector('.label').textContent = label;
                    template.querySelector('.day').textContent = dayComponent;
                    template.querySelector('.time').textContent = timeComponent;

                    if (timezone === me) {
                        console.log('This is my timezone:', timezone);
                        console.log('Template element:', template);
                        console.log('Timezone entry element:', template.querySelector('.timezone-entry'));
                        template.querySelector('.timezone-entry').classList.add('me');
                    }
                    parentDiv.appendChild(template);
                }
                timezonesContainer.innerHTML = parentDiv.innerHTML;
            }

            setInterval(() => {
                consoleTimes(new Date());
            }, 500);
        </script>
    </head>
    <body>
        <div id="timezones"></div>

        <hr/>

        <h3>FAQ</h3>

        <div class="question">Why is this needed?</div>
        <p class="answer">Because I'm to lazy to do the math.</p>

        <div class="question">Is it accurate?</div>
        <p class="answer">Nope, it's not guaranteed.</p>

    </body>
    <template id="timezone-template">
        <div class="timezone-entry">
            <hr/>

            <div>
                <span class="label"></span>
            </div>
            <div>
                <span class="time"></span>
            </div>
            <div>
                <span class="day"></span>
            </div>
        </div>

    </template>
</html>
