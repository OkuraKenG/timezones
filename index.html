<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cause they're a pain</title>
        <style>
            body {
                font-family: times new roman, serif;
                background-color: #000;
                color: #fff;
                justify-content: center;
                align-items: center;
                text-align: center;
            }

            .timezone-entry {
                margin-bottom: 10px;
                justify-content: center;
                align-items: center;
                text-align: center;

                .time {
                    font-size: 2.5em;
                }

                .day {
                    font-size: 0.8em;
                }

             
            }

            hr {
                border: 0;
                border-top: 0.5px solid #ffffff58;
                width: 25%;
            }

            .question {
                margin-top: 0px;
                margin-bottom: 0px;
            }
            .answer {
                font-size: 0.7em;
                margin-top: 5px
            }

            .me {
                color: rgb(231, 129, 124);
            }
        </style>
        <script>
            const imageSources = [
                ...Array.from({ length: 10 }, (_, i) => `assets/${i}.svg`),
                'assets/on-dot.svg',
            ];
            const loadedImages = new Set();
            const imageLoading = Promise.all(imageSources.map(source => new Promise(resolve => {
                const image = new Image();
                image.onload = () => {
                    loadedImages.add(source);
                    resolve();
                };
                image.onerror = () => resolve();
                image.src = source;
            })));

            const urlParams = new URLSearchParams(window.location.search);
            const timezones = urlParams.get('timezones') ? urlParams.get('timezones').split(',') : ['UTC'];
            const labels = urlParams.get('labels') ? urlParams.get('labels').split(',') : ['UTC'];
            const me = urlParams.get('me') ?? 'UTC';
 
            function consoleTimes(time) {
                const timezonesContainer = document.getElementById('timezones');

                for (let i = 0; i < timezones.length; i++) {
                    const timezone = timezones[i];
                    const label = labels[i] ? labels[i] : timezone;
                    const dateArray = `${new Intl.DateTimeFormat('en-US', {
                        year: "numeric",
                        month: "long",
                        day: "numeric",
                        hour: "numeric",
                        minute: "numeric",
                        second: "numeric",
                        hour12: false,
                        timeZone: timezone,
                    }).format(time)}`.split(' at ');

                    const dayComponent = dateArray[0];
                    const timeComponent = dateArray[1];

                    let entry = timezonesContainer.children[i];
                    if (!entry) {
                        entry = document.getElementById('timezone-template').content.cloneNode(true).firstElementChild;
                        timezonesContainer.appendChild(entry);
                    }

                    entry.querySelector('.label').textContent = label;
                    entry.querySelector('.day').textContent = dayComponent;

                    const [hours, minutes, seconds] = timeComponent.split(':');
                    const digits = [
                        ['#h0', hours[0]],
                        ['#h1', hours[1]],
                        ['#m0', minutes[0]],
                        ['#m1', minutes[1]],
                        ['#s0', seconds[0]],
                        ['#s1', seconds[1]],
                    ];
                    for (const [selector, digit] of digits) {
                        const source = `assets/${digit}.svg`;
                        if (loadedImages.has(source)) {
                            entry.querySelector(selector).src = source;
                        }
                    }

                    if (timezone === me) {
                        entry.classList.add('me');
                    }
                }
            }

            document.addEventListener('DOMContentLoaded', async () => {
                await imageLoading;
                consoleTimes(new Date());
                setInterval(() => consoleTimes(new Date()), 1000);
            });
        </script>
    </head>
    <body>
        <div id="timezones"></div>

        <hr/>

        <h3>FAQ</h3>

        <div class="question">Why is this needed?</div>
        <p class="answer">Because I'm to lazy to do the math.</p>

        <div class="question">Is it accurate?</div>
        <p class="answer">Nope, it's not guaranteed.</p>

    </body>
    <template id="timezone-template">
        <div class="timezone-entry">
            <hr/>

            <div>
                <span class="label"></span>
            </div>
            <div>
                <img id="h0" src="assets/0.svg" height="50" />
                <img id="h1" src="assets/0.svg" height="50" />
                <img id="dot" src="assets/on-dot.svg" height="50" />
                <img id="m0" src="assets/0.svg" height="50" />
                <img id="m1" src="assets/0.svg" height="50" />
                <img id="dot" src="assets/on-dot.svg" height="50" />
                <img id="s0" src="assets/0.svg" height="50" />
                <img id="s1" src="assets/0.svg" height="50" />
            </div>
            <div>
                <span class="day"></span>
            </div>
        </div>

    </template>
</html>
